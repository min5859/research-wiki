papers:
  count: 2
  lookback_days: 7

sources:
  huggingface:
    enabled: true
    weight: 0.7
  semantic_scholar:
    enabled: true
    weight: 0.3
    api_key: ""
    query: "artificial intelligence"

wiki:
  repo: "min5859/research-wiki"

analysis:
  language: "ko"
  prompt_file: "prompts/analyze.md"
  provider: "cursor"       # "claude" | "codex" | "cursor"
  max_retries: 2           # Retry count when analysis output is not in Korean

  claude:
    model: "sonnet"        # "sonnet", "opus", "haiku" or full model ID
    api_key: ""            # ANTHROPIC_API_KEY override for cron/oneshot

  codex:
    model: "o3"            # OpenAI model for codex CLI

  cursor:
    model: "sonnet-4"      # Model for cursor CLI
    api_key: ""
