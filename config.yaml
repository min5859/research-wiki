papers:
  count: 2
  lookback_days: 7

sources:
  huggingface:
    enabled: true
    weight: 0.7
  semantic_scholar:
    enabled: true
    weight: 0.3
    api_key: ""
    query: "artificial intelligence"

wiki:
  repo: "min5859/research-wiki"

analysis:
  language: "ko"
  prompt_file: "prompts/analyze.md"
  provider: "codex"         # "claude" | "codex" | "cursor"
  max_retries: 2           # Retry count when analysis output is not in Korean

  claude:
    model: "sonnet"        # "sonnet", "opus", "haiku" or full model ID
    api_key: ""            # ANTHROPIC_API_KEY override for cron/oneshot

  codex:
    model: ""              # codex CLI model (빈 값이면 기본 모델 사용)

  cursor:
    model: "claude-4.6-sonnet-medium"  # Model for cursor CLI
    api_key: ""
